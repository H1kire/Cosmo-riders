name: Cosmo-riders — Rust/WASM Quality Gate and GitHub Pages

on:
  push:
    branches: [test]
  pull_request:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cosmo-riders-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.86.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      - name: Test Rust computational core
        run: cargo test --workspace
      - name: Build Rust/WASM browser package
        run: wasm-pack build crates/cosmo-core --target web --out-dir ../../src/wasm/pkg --out-name cosmo_core --release
      - name: Preserve the resolved Cargo lockfile
        uses: actions/upload-artifact@v4
        with:
          name: cosmo-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
      - name: Verify generated WASM package
        run: node --input-type=module -e "import { access, stat } from 'node:fs/promises'; const base='src/wasm/pkg/'; for (const file of ['cosmo_core.js','cosmo_core.d.ts','cosmo_core_bg.wasm']) await access(base+file); const wasm=await stat(base+'cosmo_core_bg.wasm'); if (wasm.size===0) throw new Error('Generated WASM module is empty');"
      - name: Install dependencies
        run: npm install --strict-allow-scripts --no-audit --no-fund
      - name: Run complete quality audit
        run: npm run audit
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Check published pages and MIME types
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/audit-live.mjs
